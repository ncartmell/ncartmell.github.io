<style>
  .backlink{
    font-family:var(--mono); font-size:.78rem; color:var(--faint);
    border:0; display:inline-block; margin-bottom:2rem;
  }
  .backlink:hover{color:var(--accent)}
  article{max-width:36rem}
  article h1{font-size:1.85rem; letter-spacing:-.021em; font-weight:650; line-height:1.2}
  .posted{font-family:var(--mono); font-size:.78rem; color:var(--faint); margin:.6rem 0 2rem}
  article h2{
    font-family:var(--sans); font-size:1.12rem; font-weight:620; color:var(--fg);
    text-transform:none; letter-spacing:normal; border:0; padding:0;
    margin:2.2rem 0 .7rem;
  }
  article p{margin:0 0 1.1rem; font-size:1rem}
  article ul,article ol{margin:0 0 1.1rem; padding-left:1.15rem}
  article li{margin-bottom:.45rem}
  article li::marker{color:var(--faint)}
  article blockquote{
    margin:0 0 1.1rem; padding-left:1rem;
    border-left:2px solid var(--rule); color:var(--muted);
  }
  code{
    font-family:var(--mono); font-size:.88em;
    background:var(--chip-bg); padding:.12em .35em; border-radius:3px;
  }
  pre{
    background:var(--chip-bg); padding:1rem; border-radius:6px;
    overflow-x:auto; margin:0 0 1.1rem; font-size:.84rem; line-height:1.55;
  }
  pre code{background:none; padding:0; font-size:inherit}
  figure{margin:0 0 1.3rem}
  figure img{width:100%; height:auto; border-radius:6px; border:1px solid var(--rule)}
  figcaption{font-size:.84rem; color:var(--faint); margin-top:.5rem}
</style>
</head>
